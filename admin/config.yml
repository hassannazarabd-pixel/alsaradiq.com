backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "إدارة محتوى الموقع"
    files:
      - file: "content/site.json"
        label: "معلومات الموقع الرئيسية"
        name: "site"
        fields:
          - {label: "الشعار العلوي", name: "tagline", widget: "string"}
          - {label: "عنوان الهيرو البارز", name: "hero_eyebrow", widget: "string"}
          - {label: "العنوان الرئيسي (H1)", name: "hero_headline", widget: "string"}
          - {label: "الوصف تحت العنوان", name: "hero_sub", widget: "text"}
          - {label: "مقولة من نحن", name: "about_quote", widget: "string"}
          - {label: "نص من نحن", name: "about_text", widget: "text"}
          - {label: "رقم الواتساب", name: "contact_whatsapp", widget: "string"}
          - {label: "رقم الهاتف الظاهر", name: "contact_phone_display", widget: "string"}
          - {label: "موقع الشركة", name: "contact_location", widget: "string"}
